<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie - My Games</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function () {
  var mode = localStorage.getItem('themeMode') || 'auto';
  if (mode !== 'auto') document.documentElement.setAttribute('data-theme', mode);
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">🎮 MY GAMES</a>
    <nav class="site-nav">
      <a href="index.html">Główne</a>
      <a href="settings.html">Ustawienia</a>
    </nav>
    <a href="add-game.html" class="btn btn--accent">+ Dodaj grę</a>
    <div class="account-widget" id="account-widget"></div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab is-active" data-tab="login">Zaloguj się</button>
        <button type="button" class="auth-tab" data-tab="register">Zarejestruj się</button>
      </div>

      <div id="auth-form-container"></div>

      <p class="auth-error" id="auth-error" hidden></p>
    </div>
  </main>

  <footer class="site-footer">
    <p>Zrobione z ❤️ i hostowane na GitHub Pages</p>
  </footer>

  <template id="login-template">
    <form id="login-form" class="auth-form">
      <label>Nazwa użytkownika
        <input type="text" name="username" required autocomplete="username">
      </label>
      <label>Hasło
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn--accent">Zaloguj się</button>
    </form>
  </template>

  <template id="register-template">
    <form id="register-form" class="auth-form">
      <label>Nazwa użytkownika
        <input type="text" name="username" required autocomplete="username">
      </label>
      <label>Hasło
        <input type="password" name="password" required minlength="8" autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn--accent">Utwórz konto</button>
    </form>
  </template>

  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script>
    var tabs = document.querySelectorAll('.auth-tab');
    var container = document.getElementById('auth-form-container');
    var errorEl = document.getElementById('auth-error');
    var loginTemplate = document.getElementById('login-template');
    var registerTemplate = document.getElementById('register-template');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.hidden = false;
    }

    function renderForm(which) {
      errorEl.hidden = true;
      container.innerHTML = '';
      var template = which === 'login' ? loginTemplate : registerTemplate;
      container.appendChild(template.content.cloneNode(true));

      var form = container.querySelector('form');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var data = new FormData(form);
        var username = data.get('username').trim();
        var password = data.get('password');
        var action = which === 'login' ? loginUser : registerUser;
        action(username, password)
          .then(function () { window.location.href = 'index.html'; })
          .catch(function (err) { showError(err.message); });
      });
    }

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) { t.classList.remove('is-active'); });
        tab.classList.add('is-active');
        renderForm(tab.dataset.tab);
      });
    });

    renderForm('login');
  </script>
</body>
</html>

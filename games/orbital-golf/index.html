<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orbitalny Golf</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: "Trebuchet MS", "Segoe UI", -apple-system, Roboto, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; background: #0a1220; color: #eef3fb; touch-action: manipulation; -webkit-user-select: none; user-select: none; }

  .screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .screen.is-active { display: flex; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem; padding: 0.65rem 1.2rem; border-radius: 12px; border: none; font-size: 0.92rem; font-weight: 800; cursor: pointer; background: #f9c80e; color: #3a2a00; font-family: inherit; box-shadow: 0 3px 0 #b88a00; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b88a00; }
  .btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; transform: none; }
  .btn--ghost { background: transparent; border: 1px solid #2c4263; color: #d5e2f5; box-shadow: none; }
  .btn--green { background: #35d36b; color: #05260f; box-shadow: 0 3px 0 #1e9b4a; }
  .btn--small { padding: 0.35rem 0.7rem; font-size: 0.74rem; border-radius: 9px; }

  #screen-menu { align-items: center; justify-content: center; gap: 0.9rem; padding: 1.2rem; text-align: center; overflow: auto; background: linear-gradient(#4de8a6, #bdfbdc 70%, #3fbf7a 70%); color: #06402a; }
  #screen-menu h1 { margin: 0; font-size: 2.1rem; text-shadow: 0 2px 0 rgba(255,255,255,0.6); }
  #screen-menu p { margin: 0; color: #0b5a3b; font-size: 0.9rem; max-width: 340px; line-height: 1.5; font-weight: 600; }
  #menu-stats { color: #7a4d00; font-size: 0.95rem; font-weight: 800; min-height: 1.3em; }
  #screen-menu .btn { min-width: 230px; }
  #screen-menu .btn--ghost { color: #06402a; border-color: rgba(6,64,42,0.4); }

  #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #4de8a6; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,0.45); }
  #ui button, #ui .pill, #ui .upg { pointer-events: auto; }
  #ui #upg-panel, #ui #bottom-left, #ui #bottom-right, #ui #top-left { transition: opacity 0.3s; }
  #ui.in-flight #upg-panel, #ui.in-flight #bottom-left, #ui.in-flight #bottom-right { opacity: 0; pointer-events: none; }
  #ui.in-flight #upg-panel *, #ui.in-flight #bottom-left *, #ui.in-flight #bottom-right * { pointer-events: none; }

  #top-left { position: absolute; left: 0.5rem; top: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
  .round-btn { width: 40px; height: 40px; border-radius: 12px; border: 3px solid #fff; background: #3f8fe0; color: #fff; font-size: 1.2rem; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.25); padding: 0; line-height: 1; }
  .pill { display: flex; align-items: center; gap: 0.35rem; background: rgba(8,88,62,0.8); border-radius: 999px; padding: 0.2rem 0.8rem 0.2rem 0.25rem; font-weight: 800; font-size: 0.95rem; min-width: 76px; border: 2px solid rgba(255,255,255,0.35); }
  .coin-ico { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3a0, #f4b400 60%, #c98200); border: 2px solid #c98200; display: inline-block; flex-shrink: 0; }
  .gem-ico { font-size: 1.3rem; line-height: 1; }

  #top-center { position: absolute; left: 50%; top: 0.5rem; transform: translateX(-50%); text-align: center; pointer-events: none; width: min(56%, 300px); }
  #dist-big { font-size: 2rem; font-weight: 900; line-height: 1; -webkit-text-stroke: 1px rgba(0,60,40,0.5); }
  #goal-text { font-size: 0.72rem; font-weight: 800; margin-top: 0.15rem; line-height: 1.25; }
  #goal-text b { color: #ffe066; }

  #top-right { position: absolute; right: 0.6rem; top: 0.6rem; width: min(190px, 34vw); pointer-events: none; }
  #goal-bar { position: relative; height: 16px; border-radius: 999px; background: rgba(8,70,110,0.85); border: 2px solid rgba(255,255,255,0.7); }
  #goal-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 999px; background: linear-gradient(#5dd2ff, #1e9be0); }
  #goal-golfer { position: absolute; top: -9px; left: 0%; margin-left: -9px; font-size: 1.1rem; }
  #goal-flag { position: absolute; top: -12px; right: -6px; font-size: 1.2rem; }
  #goal-label { text-align: right; font-size: 0.7rem; font-weight: 800; margin-top: 0.15rem; }

  #upg-panel { position: absolute; left: 0.5rem; top: 3.3rem; display: flex; flex-direction: column; gap: 0.4rem; }
  .upg { display: flex; width: min(214px, 54vw); border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,0.65); box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  .upg.k-str { background: rgba(176,104,90,0.88); }
  .upg.k-spd { background: rgba(28,170,205,0.88); }
  .upg.k-bnc { background: rgba(62,172,84,0.88); }
  .u-main { flex: 1; padding: 0.3rem 0.45rem; display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
  .u-ico { font-size: 1.4rem; width: 1.7rem; text-align: center; flex-shrink: 0; }
  .u-text { min-width: 0; line-height: 1.15; }
  .u-title { font-weight: 900; font-size: 0.8rem; display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; }
  .u-price { white-space: nowrap; display: inline-flex; align-items: center; gap: 0.2rem; background: rgba(0,0,0,0.3); border-radius: 999px; padding: 0 0.4rem 0 0.15rem; font-size: 0.72rem; }
  .u-price .coin-ico { width: 14px; height: 14px; border-width: 1px; }
  .u-sub { font-size: 0.64rem; font-weight: 700; opacity: 0.92; }
  .u-btn { width: 66px; border: none; border-left: 2px solid rgba(255,255,255,0.5); background: rgba(120,20,40,0.85); color: #fff; font-weight: 900; font-size: 0.68rem; cursor: pointer; font-family: inherit; line-height: 1.1; padding: 0.2rem; text-shadow: none; }
  .u-btn b { display: block; font-size: 0.95rem; }
  .u-btn:disabled { background: rgba(60,60,60,0.6); color: rgba(255,255,255,0.6); cursor: default; }
  .u-btn.is-ready { background: #35c76b; color: #05260f; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.04); } }

  #bottom-left { position: absolute; left: 0.5rem; bottom: 0.5rem; }
  .club-btn { display: flex; flex-direction: column; align-items: center; gap: 0.1rem; width: 74px; padding: 0.3rem 0.2rem; border-radius: 14px; border: 3px solid #fff; background: #e9f7ff; color: #3b4a5a; font-weight: 900; font-size: 0.66rem; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.25); text-shadow: none; font-family: inherit; }
  .club-btn span { font-size: 1.7rem; line-height: 1; }
  #bottom-right { position: absolute; right: 0.5rem; bottom: 0.5rem; display: flex; gap: 0.4rem; }
  .sq-btn { width: 54px; height: 54px; border-radius: 12px; border: 3px solid #fff; background: #ffd7e0; font-size: 1.6rem; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.25); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 0; text-shadow: none; font-family: inherit; }
  .sq-btn small { font-size: 0.55rem; font-weight: 900; color: #b3173a; margin-top: 2px; }
  .sq-btn.is-ready { animation: pulse 1s ease-in-out infinite; background: #fff0a8; }
  #b-star { background: #fff3c4; }

  #banner { position: absolute; top: 26%; left: 50%; transform: translate(-50%, 0); font-size: 2rem; font-weight: 900; text-shadow: 0 3px 0 rgba(0,0,0,0.35); pointer-events: none; opacity: 0; transition: opacity 0.25s, transform 0.25s; white-space: nowrap; color: #fff; -webkit-text-stroke: 1.5px rgba(0,60,40,0.55); }
  #banner.is-visible { opacity: 1; transform: translate(-50%, -10px); }

  #result { position: absolute; left: 50%; bottom: 0.7rem; transform: translateX(-50%); width: min(92%, 380px); background: rgba(8,70,50,0.94); border: 3px solid #fff; border-radius: 16px; padding: 0.8rem 1rem; text-align: center; display: none; z-index: 5; }
  #result.is-visible { display: block; }
  #result h2 { margin: 0 0 0.3rem; font-size: 1.5rem; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  #result .r-lines { font-size: 0.84rem; color: #d9fff0; line-height: 1.6; margin-bottom: 0.7rem; font-weight: 700; }
  #result .r-lines b { color: #ffe066; }
  #result .r-buttons { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }

  .modal { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(6,40,30,0.97); display: none; flex-direction: column; z-index: 20; }
  .modal.is-open { display: flex; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0.8rem; border-bottom: 1px solid #1d6b4c; font-weight: 800; }
  .tabs { display: flex; gap: 0.35rem; padding: 0.5rem 0.7rem 0; flex-wrap: wrap; }
  .tab { padding: 0.4rem 0.75rem; border-radius: 9px; border: 1px solid #2f8a63; background: transparent; color: #bfeedd; font-size: 0.78rem; font-weight: 800; cursor: pointer; font-family: inherit; }
  .tab.is-active { background: #f9c80e; color: #3a2a00; border-color: #f9c80e; }
  .modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0.7rem; display: flex; flex-direction: column; gap: 0.55rem; }
  .row { display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem; border: 2px solid #1d6b4c; border-radius: 12px; background: #0b3a2b; }
  .row.is-sel { border-color: #35d36b; }
  .row .ico { font-size: 1.5rem; width: 2rem; text-align: center; flex-shrink: 0; }
  .row .info { flex: 1; min-width: 0; font-size: 0.8rem; line-height: 1.35; }
  .row .info b { font-size: 0.92rem; }
  .row .info span { color: #9ad8c0; display: block; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.8); flex-shrink: 0; }

  #wheel-area { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; padding: 0.5rem; }
  #wheel-box { position: relative; width: 250px; height: 250px; }
  #wheel { width: 250px; height: 250px; border-radius: 50%; border: 4px solid #f9c80e; position: relative; transition: transform 4s cubic-bezier(0.12, 0.7, 0.1, 1); }
  .wheel-label { position: absolute; left: 50%; top: 50%; font-size: 0.8rem; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.7); width: 60px; margin-left: -30px; margin-top: -9px; text-align: center; }
  #wheel-pointer { position: absolute; top: -12px; left: 50%; margin-left: -12px; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid #fff; z-index: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
  #wheel-msg { min-height: 1.4em; font-weight: 800; color: #ffe066; text-align: center; }

  @media (max-width: 560px) {
    .upg { width: 148px; }
    .u-sub { display: none; }
    .u-btn { width: 54px; font-size: 0.6rem; }
    #dist-big { font-size: 1.6rem; }
    #goal-text { font-size: 0.64rem; }
    .pill { min-width: 64px; font-size: 0.85rem; }
    #top-center { left: auto; right: 0.6rem; top: 3.3rem; transform: none; text-align: right; width: 44vw; }
    .u-title { font-size: 0.7rem; }
    .u-name { overflow: hidden; text-overflow: ellipsis; }
    .u-main { overflow: hidden; }
  }
</style>
</head>
<body>

<div id="boot-error"></div>
<script>
// Registered before the game script so a parse/runtime error shows up on the
// page instead of leaving a silent blank screen (no console on a phone).
window.addEventListener('error', function (e) {
  var box = document.getElementById('boot-error');
  if (!box) return;
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#1a0a0a;color:#ff8a8a;' +
    'font:13px/1.5 -apple-system,sans-serif;padding:1.2rem;overflow:auto;white-space:pre-wrap;';
  box.textContent = '⚠️ Błąd uruchamiania gry:\n\n' + (e.message || 'Nieznany błąd') +
    (e.filename ? '\n' + e.filename + ':' + e.lineno + ':' + e.colno : '') +
    '\n\nPrześlij ten tekst, żeby dało się to naprawić.';
});
</script>

<section id="screen-menu" class="screen is-active">
  <h1>⛳🚀 Orbitalny Golf</h1>
  <p>Dotknij, gdy strzałka wskaże idealny kąt, i wystrzel piłkę jak najdalej. Zbieraj monety, ulepszaj uderzenie, odblokowuj nowe światy — aż do orbity! Postęp zapisuje się sam.</p>
  <div id="menu-stats"></div>
  <button class="btn" id="btn-play" type="button">▶ Graj</button>
  <button class="btn btn--ghost" id="btn-reset" type="button">Zresetuj postęp</button>
</section>

<section id="screen-game" class="screen">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="ui">
      <div id="top-left">
        <button class="round-btn" id="btn-gear" type="button" aria-label="Menu">⚙</button>
        <div class="pill"><span class="coin-ico"></span><b id="hud-coins">0</b></div>
        <div class="pill"><span class="gem-ico">💎</span><b id="hud-gems">0</b></div>
      </div>
      <div id="top-center"><div id="dist-big">0 m</div><div id="goal-text"></div></div>
      <div id="top-right">
        <div id="goal-bar"><div id="goal-fill"></div><div id="goal-golfer">🏌️</div><div id="goal-flag">🚩</div></div>
        <div id="goal-label"></div>
      </div>
      <div id="upg-panel"></div>
      <div id="bottom-left"><button class="club-btn" id="b-club" type="button"><span>🏌️</span>Szatnia</button></div>
      <div id="bottom-right">
        <button class="sq-btn" id="b-gift" type="button">🎁<small id="gift-timer"></small></button>
        <button class="sq-btn" id="b-star" type="button">🌍</button>
      </div>
    </div>

    <div id="banner"></div>
    <div id="result">
      <h2 id="r-title"></h2>
      <div class="r-lines" id="r-lines"></div>
      <div class="r-buttons">
        <button class="btn btn--green" id="r-next" type="button">Dalej →</button>
        <button class="btn" id="r-putt" type="button" style="display:none">⛳ Dobitka</button>
        <button class="btn" id="r-shop" type="button">Ulepsz</button>
      </div>
    </div>

    <div class="modal" id="shop">
      <div class="modal-head"><span>Szatnia i sklep</span><button class="btn btn--ghost btn--small" id="shop-close" type="button">Zamknij ✕</button></div>
      <div class="tabs" id="shop-tabs"></div>
      <div class="modal-body" id="shop-body"></div>
    </div>

    <div class="modal" id="wheelm">
      <div class="modal-head"><span>Koło szczęścia 🎡</span><button class="btn btn--ghost btn--small" id="wheel-close" type="button">Zamknij ✕</button></div>
      <div class="modal-body">
        <div id="wheel-area">
          <div id="wheel-box"><div id="wheel-pointer"></div><div id="wheel"></div></div>
          <div id="wheel-msg"></div>
          <button class="btn" id="wheel-spin" type="button">Zakręć!</button>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  var DT = 1 / 120, MAXLV = 40, CHUNK = 60, BALL_R = 0.3;
  var CURV_R = 900; // virtual planet radius (m) for the horizon curvature at altitude

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function hash(a, b, c) {
    var h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul((c | 0) + 1, 2147483629);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // ---------- Swing gauge (fan) ----------
  // The arrow sweeps the fan; where it stops is the launch angle. Green = ideal.
  var ANG_MIN = 8, ANG_MAX = 82, ANG_CENTER = 46;
  var ZONES = [
    { max: 4, mult: 1.1, coin: 1.3, col: '#35d36b', name: 'IDEALNE! ✨' },
    { max: 10, mult: 1.0, coin: 1.1, col: '#b5e61d', name: 'Świetnie!' },
    { max: 18, mult: 0.9, coin: 1, col: '#ffd800', name: 'Dobrze!' },
    { max: 28, mult: 0.78, coin: 1, col: '#ff9f1c', name: 'Tak sobie…' },
    { max: 90, mult: 0.62, coin: 1, col: '#e8453c', name: 'Słabo…' },
  ];
  function zoneFor(theta) {
    var d = Math.abs(theta - ANG_CENTER);
    for (var i = 0; i < ZONES.length; i++) if (d <= ZONES[i].max) return ZONES[i];
    return ZONES[ZONES.length - 1];
  }

  // ---------- Worlds ----------
  var WORLDS = [
    { id: 'meadow', name: 'Łąka', g: 9.8, drag: 0.035, mu: 0.32, muSand: 1.7, e: 0.5, eSand: 0.06, skip: true,
      A1: 2.5, f1: 0.040, p1: 0.3, A2: 1.2, f2: 0.103, p2: 1.1, A3: 3.5, f3: 0.021, p3: 2.0,
      hz: { water: 0.14, sand: 0.2, trees: 0.25, pole: 0.1 }, tree: 'tree', house: 'cottage',
      sky: ['#46dfa0', '#c9fbe1'], hills: ['#7fe0aa', '#4cc784', '#2fa766'], ground: ['#2fa84f', '#5bd96d'], sandColor: '#f0d48a', waterColor: '#2b8be6',
      earn: 1, orbit: 1500, holes: [120, 420, 1100], spaceAlt: 900 },
    { id: 'desert', name: 'Pustynia', g: 9.8, drag: 0.035, mu: 0.45, muSand: 1.7, e: 0.42, eSand: 0.08, skip: true,
      A1: 3.2, f1: 0.034, p1: 1.4, A2: 1.6, f2: 0.09, p2: 0.2, A3: 4.0, f3: 0.017, p3: 0.5,
      hz: { water: 0.08, sand: 0.4, trees: 0.25, pole: 0.1 }, tree: 'cactus', house: 'adobe',
      sky: ['#ff9a5a', '#ffe9c0'], hills: ['#f0b67a', '#dd9a58', '#c3803f'], ground: ['#d9a95a', '#f2cd7c'], sandColor: '#f7dc96', waterColor: '#1abc9c',
      earn: 2.2, orbit: 5000, holes: [250, 900, 2800], spaceAlt: 1000 },
    { id: 'snow', name: 'Śnieżna kraina', g: 9.8, drag: 0.03, mu: 0.07, muSand: 0.9, e: 0.45, eSand: 0.1, skip: true,
      A1: 2.8, f1: 0.038, p1: 2.2, A2: 1.4, f2: 0.11, p2: 0.9, A3: 3.8, f3: 0.02, p3: 1.2,
      hz: { water: 0.14, sand: 0.2, trees: 0.3, pole: 0.1 }, tree: 'pine', house: 'cabin',
      sky: ['#6ec0ff', '#eaf6ff'], hills: ['#e4f1ff', '#bcd9f2', '#9cc3e6'], ground: ['#d3e3f2', '#ffffff'], sandColor: '#aed6f1', waterColor: '#4d9bd6',
      earn: 4, orbit: 10000, holes: [400, 1500, 5500], spaceAlt: 1100 },
    { id: 'moon', name: 'Księżyc', g: 1.62, drag: 0.0, mu: 0.35, muSand: 1.2, e: 0.5, eSand: 0.1, skip: false,
      A1: 4.5, f1: 0.03, p1: 0.7, A2: 2.0, f2: 0.08, p2: 2.5, A3: 6.0, f3: 0.015, p3: 1.9,
      hz: { water: 0.14, sand: 0.2, trees: 0.25, pole: 0.1 }, tree: 'rock', house: null,
      sky: ['#04060f', '#10172c'], hills: ['#2a2f3d', '#3a4052', '#4b5266'], ground: ['#8a8d94', '#b4b7be'], sandColor: '#6b6e75', waterColor: '#161a26',
      earn: 8, orbit: 40000, holes: [1500, 8000, 25000], spaceAlt: 0 },
  ];
  WORLDS.forEach(function (W) {
    W.holeY = W.holes.map(function (hx) { return baseHeight(W, hx); });
    W.cache = {};
    W.scn = {};
  });

  function baseHeight(W, x) {
    if (x <= 0) return 0;
    var a = smooth(x / 50);
    return a * (W.A1 * Math.sin(x * W.f1 + W.p1) + W.A2 * Math.sin(x * W.f2 + W.p2) + W.A3 * Math.sin(x * W.f3 + W.p3));
  }

  function nearHole(W, a, b) {
    for (var i = 0; i < W.holes.length; i++) if (W.holes[i] > a - 14 && W.holes[i] < b + 14) return true;
    return false;
  }

  // Hazards (and the birds) are generated lazily per 60 m chunk from a hash, so
  // the course is endless and identical every time.
  function chunkFeatures(W, k) {
    var c = W.cache[k];
    if (c) return c;
    var list = [];
    if (k === 0) {
      // a bunker close to the tee: weak shots plop into it
      list.push({ type: 'sand', a: 22, b: 40, level: baseHeight(W, 31) });
    } else if (k === 1) {
      // two trees a bit further on - a good shot has to clear them (or burn through)
      list.push({ type: 'tree', x: 92, w: 2.2, h: 7, gy: baseHeight(W, 92), id: '1a' });
      list.push({ type: 'tree', x: 108, w: 2.2, h: 8.5, gy: baseHeight(W, 108), id: '1b' });
    } else if (k >= 2) { // the first 120 m have no ponds so a beginner's first shots can land
      var r = hash(k, W.id.length * 31 + W.g, 1), start = k * CHUNK + 8 + hash(k, 7, 2) * 20;
      var hz = W.hz, acc = 0, kind = 'none';
      if (r < (acc += hz.water)) kind = 'water';
      else if (r < (acc += hz.sand)) kind = 'sand';
      else if (r < (acc += hz.trees)) kind = 'trees';
      else if (r < (acc += hz.pole)) kind = 'pole';
      var len = 12 + hash(k, 5, 3) * 16;
      if (kind === 'water' || kind === 'sand') {
        if (!nearHole(W, start, start + len)) {
          var lvl = baseHeight(W, start + len / 2) - (kind === 'water' ? 0.3 : 0);
          list.push({ type: kind, a: start, b: start + len, level: lvl });
        }
      } else if (kind === 'trees') {
        var n = 1 + Math.floor(hash(k, 9, 4) * 3), px = start;
        for (var i = 0; i < n; i++) {
          px += 3 + hash(k, i, 5) * 5;
          if (nearHole(W, px, px)) continue;
          list.push({ type: 'tree', x: px, w: 2.2, h: 6 + hash(k, i, 6) * 4, gy: baseHeight(W, px), id: 't' + k + '_' + i });
        }
      } else if (kind === 'pole') {
        var pxx = start + 10;
        if (!nearHole(W, pxx, pxx)) list.push({ type: 'pole', x: pxx, w: 0.5, h: 14, gy: baseHeight(W, pxx), id: 'p' + k });
      }
      // a bird now and then — hit one for a coin bonus
      if (k >= 2 && hash(k, 21, 7) < 0.6) {
        list.push({ type: 'bird', x: k * CHUNK + 5 + hash(k, 22, 8) * 50, y: 10 + hash(k, 23, 9) * 55, key: k });
      }
    }
    W.cache[k] = list;
    return list;
  }

  // Decorative (non-colliding) scenery behind the fairway: houses and trees.
  function chunkScenery(W, k) {
    var c = W.scn[k];
    if (c) return c;
    var list = [];
    if (k >= 0) {
      var i, x;
      if (W.house && hash(k, 31, 1) < 0.55) {
        x = k * CHUNK + 6 + hash(k, 32, 2) * 48;
        if (x >= 30 && !surfaceAt(W, x) && !surfaceAt(W, x + 5)) list.push({ type: 'house', x: x, v: Math.floor(hash(k, 33, 3) * 3) });
      }
      var nt = 2 + Math.floor(hash(k, 34, 4) * 3);
      for (i = 0; i < nt; i++) {
        x = k * CHUNK + hash(k, 35 + i, 5) * CHUNK;
        if (x >= 45 && !surfaceAt(W, x)) list.push({ type: 'stree', x: x, s: 0.8 + hash(k, 40 + i, 6) * 0.9 });
      }
    }
    W.scn[k] = list;
    return list;
  }

  var GREEN_R = 6; // lighter putting green around each hole (flat, you can finish with a putt)

  function applyZone(y, x, a, b, level, isWater) {
    var d = x < a ? a - x : (x > b ? x - b : 0);
    if (d >= 9) return y;
    if (isWater && d <= 0) {
      var t = (x - a) / (b - a);
      return level - 2.6 * Math.pow(Math.sin(Math.PI * t), 0.7);
    }
    var w = d <= 0 ? 1 : smooth(1 - d / 9);
    return y + (level - y) * w;
  }

  function groundY(W, x) {
    var y = baseHeight(W, x);
    var k = Math.floor(x / CHUNK);
    for (var kk = k - 1; kk <= k + 1; kk++) {
      if (kk < 0) continue;
      var fs = chunkFeatures(W, kk);
      for (var i = 0; i < fs.length; i++) {
        var f = fs[i];
        if (f.type === 'water' || f.type === 'sand') y = applyZone(y, x, f.a, f.b, f.level, f.type === 'water');
      }
    }
    for (var h = 0; h < W.holes.length; h++) y = applyZone(y, x, W.holes[h] - GREEN_R, W.holes[h] + GREEN_R, W.holeY[h], false);
    return y;
  }

  function surfaceAt(W, x) {
    var k = Math.floor(x / CHUNK);
    for (var kk = k - 1; kk <= k + 1; kk++) {
      if (kk < 0) continue;
      var fs = chunkFeatures(W, kk);
      for (var i = 0; i < fs.length; i++) {
        var f = fs[i];
        if ((f.type === 'water' || f.type === 'sand') && x >= f.a && x <= f.b) return f;
      }
    }
    return null;
  }

  // ---------- Physics ----------

  function makeBall() { return { x: 0, y: 0.3, vx: 0, vy: 0, rest: 0, t: 0, skips: 0, holeIdx: -1, birds: 0, hit: {}, splash: null, fire: false, destroyed: {}, crash: null, trees: 0 }; }

  function launchBall(b, P, angleDeg, mult, fire) {
    b.fire = !!fire;
    var v = P.v0 * mult;
    var a = angleDeg * Math.PI / 180;
    b.vx = v * Math.cos(a);
    b.vy = v * Math.sin(a);

  }

  function collideObstacles(b, W) {
    var k = Math.floor(b.x / CHUNK);
    for (var kk = k - 1; kk <= k + 1; kk++) {
      if (kk < 0) continue;
      var fs = chunkFeatures(W, kk);
      for (var i = 0; i < fs.length; i++) {
        var f = fs[i];
        if (f.type === 'bird') {
          if (!b.hit[f.key]) {
            var dx = b.x - f.x, dy = b.y - f.y;
            if (dx * dx + dy * dy < 20) { // ~4.5 m radius: big, forgiving birds
              b.hit[f.key] = true; b.birds++;

              b.feather = { x: f.x, y: f.y };

          continue;

        if (b.destroyed[f.id]) continue;

        if (b.x > f.x - hw && b.x < f.x + hw && b.y < top && b.y > f.gy - 1) {

            continue;

          } else {

  function sub(b, W, P, h) {
    var dg = Math.exp(-P.drag * h);
    b.vx *= dg; b.vy *= dg;
    b.vy -= W.g * h;
    b.x += b.vx * h; b.y += b.vy * h;

    var surf = surfaceAt(W, b.x);
    if (surf && surf.type === 'water' && b.y <= surf.level) {
      var s0 = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      b.splash = { x: b.x, y: surf.level, v: s0 };

        b.vy = -b.vy * 0.45; b.vx *= 0.78; b.y = surf.level + 0.02; b.skips++;

    }

    var gy = groundY(W, b.x);
    var sp;
    if (b.y <= gy) {
      var sl = (groundY(W, b.x + 0.05) - groundY(W, b.x - 0.05)) / 0.1;
      var nl = Math.sqrt(1 + sl * sl), nx = -sl / nl, ny = 1 / nl;
      var onSand = surf && surf.type === 'sand';
      var mu = P.muScale * (onSand ? W.muSand : W.mu);
      var e = Math.min(0.94, (onSand ? W.eSand : W.e) * P.bounce);
      b.y = gy;
      var vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        if (vn > -1.5) e = 0;
        b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
        var tx0 = ny, ty0 = -nx;
        var kd = (b.putt && vn > -1.5) ? 0 : Math.min(0.5, 0.04 + 0.06 * mu); // a putt just rolls: no impact damping
        var vt0 = (b.vx * tx0 + b.vy * ty0) * (1 - kd);
        var vn0 = b.vx * nx + b.vy * ny;
        b.vx = vt0 * tx0 + vn0 * nx; b.vy = vt0 * ty0 + vn0 * ny;
      }
      var tx = ny, ty = -nx;
      var vt = b.vx * tx + b.vy * ty, vn1 = b.vx * nx + b.vy * ny;
      var dec = mu * W.g * h * ny;
      if (vt > 0) vt = Math.max(0, vt - dec); else vt = Math.min(0, vt + dec);
      b.vx = vt * tx + vn1 * nx; b.vy = vt * ty + vn1 * ny;
      sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (sp < 0.35) b.rest += h; else b.rest = 0;

        if (Math.abs(b.x - W.holes[hi]) < 0.9 && sp < (b.putt ? 6 : 10)) { b.holeIdx = hi; return 'hole'; }
      }
    } else {
      b.rest = 0;
    }
    return null;
  }

  // Advance by dt; returns null while flying, otherwise 'stop' | 'water' | 'hole'.
  function stepBall(b, W, P, dt) {
    var spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    var n = Math.min(14, Math.max(1, Math.ceil(spd * dt / 0.6)));
    var h = dt / n;
    for (var i = 0; i < n; i++) {
      var r = sub(b, W, P, h);
      if (r) return r;
    }
    b.t += dt;
    if (b.fire && (b.rest > 0.05 || Math.sqrt(b.vx * b.vx + b.vy * b.vy) < 14)) b.fire = false;
    if (b.rest > 0.45) return 'stop';
    return b.t > 240 ? 'stop' : null;
  }

  // ---------- Upgrades, balls, skins ----------

    { id: 'gold', name: 'Złota', color: '#f1c40f', price: 20, power: 1, earn: 3, spd: 0, bnc: 0, desc: 'Zarobki ×3.' },

    var spd = up.spd + ball.spd, bnc = up.bnc + ball.bnc;

  // Headless full shot (used for balancing/tests). angle defaults to the ideal one.
  function runShot(wi, up, ball, angle, mult) {

  }

  // ---------- Save data (per account, guest slot otherwise) ----------

  var save;
  function freshSave() {

      balls: { owned: ['std'], sel: 'std' }, skins: { owned: [0], sel: 0 },

  }
  function saveKey() {
    var user = '';

  }
  function loadSave() {
    var f = freshSave();
    try {
      var raw = localStorage.getItem(saveKey());
      var s = raw ? JSON.parse(raw) : null;
      if (s && s.v === 1) {
        f.coins = Math.max(0, +s.coins || 0);
        f.gems = Math.max(0, +s.gems || 0);
        ['str', 'spd', 'bnc'].forEach(function (k) { f.up[k] = clamp((s.up && +s.up[k]) || 0, 0, MAXLV) | 0; });
        if (s.balls && s.balls.owned) {
          f.balls.owned = s.balls.owned.filter(function (id) { return BALLS.some(function (b) { return b.id === id; }); });
          if (f.balls.owned.indexOf('std') < 0) f.balls.owned.unshift('std');
          f.balls.sel = f.balls.owned.indexOf(s.balls.sel) >= 0 ? s.balls.sel : 'std';
        }
        if (s.skins && s.skins.owned) {
          f.skins.owned = s.skins.owned.filter(function (i) { return i >= 0 && i < SKINS.length; });
          if (f.skins.owned.indexOf(0) < 0) f.skins.owned.unshift(0);
          f.skins.sel = f.skins.owned.indexOf(s.skins.sel) >= 0 ? s.skins.sel : 0;
        }
        f.unlocked = clamp(s.unlocked | 0, 0, WORLDS.length - 1);
        f.world = clamp(s.world | 0, 0, f.unlocked);
        for (var i = 0; i < WORLDS.length; i++) {
          f.best[i] = Math.max(0, +(s.best && s.best[i]) || 0);
          f.orbits[i] = !!(s.orbits && s.orbits[i]);

  function writeSave() { try { localStorage.setItem(saveKey(), JSON.stringify(save)); } catch (e) {} }
  save = loadSave();

  function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function fmtShort(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace('.', ',') + 'G';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + 'M';
    if (n >= 1e4) return Math.round(n / 1e3) + 'k';

  // ---------- DOM ----------

    var hx = W.holes[hi], d = Math.abs(hx - ball.x), a = Math.max(0.05, P.muScale * W.mu * W.g);
    var lo = Math.sqrt(2 * a * Math.max(d - 0.9, 0.01)) * 1.04, up = Math.sqrt(36 + 2 * a * (d + 0.9)) * 0.96;

    ball.vx = 0; ball.vy = 0; ball.rest = 0; ball.t = 0; ball.fire = false; ball.putt = false; ball.holeIdx = -1;
    puttT = 0; trail = []; particles = [];
    state = 'putt';
    readyAt = performance.now() + 350;
    $('result').classList.remove('is-visible');
    $('ui').classList.add('in-flight');
    banner('Dobitka! Dotknij, gdy znacznik jest w zielonym');
  }

  function puttPower() { return 1 - Math.abs(((puttT * 0.9) % 2) - 1); }

  function doPutt() {
    var v = puttPower() * puttInfo.vmax;
    ball.vx = puttInfo.dir * v; ball.vy = 0; ball.rest = 0; ball.t = 0; ball.putt = true;
    state = 'flight'; acc = 0; timeScale = 1;
  }

  function finishPutt(res) {
    state = 'result';
    $('ui').classList.remove('in-flight');
    var lines = [], title;
    if (res === 'hole') {
      var bonus = Math.round(HOLE_BONUS[ball.holeIdx] * W.earn * 0.6);
      save.coins += bonus; writeSave(); updateHud();
      title = 'Dobitka! ⛳';
      lines.push('Piłka wpadła do dołka <b>' + HOLE_NAMES[ball.holeIdx] + '</b>: <b>+' + fmt(bonus) + ' 🪙</b>');
      offerPutt(false);
    } else if (res !== 'water' && greenIdx(ball.x) >= 0) {
      title = 'Prawie! 😬';
      lines.push('Piłka została na zielonym — spróbuj jeszcze raz albo się poddaj.');
      offerPutt(true);
    } else {
      title = 'Pudło';
      lines.push(res === 'water' ? 'Piłka wpadła do wody 💦' : 'Piłka wytoczyła się poza zielone.');
      offerPutt(false);
    }
    $('r-title').textContent = title;
    $('r-lines').innerHTML = lines.join('<br>');
    $('result').classList.add('is-visible');
  }

  function finishShot(res) {
    state = 'result';
    $('ui').classList.remove('in-flight');
    var wi = save.world;
    var dist = Math.max(0, Math.round(ball.x));
    var coins = Math.floor(dist * 0.5 * W.earn * P.earn * lastZone.coin);
    var lines = [];
    var title = fmt(dist) + ' m';

    lines.push('Dystans: <b>' + fmt(dist) + ' m</b>' + (res === 'water' ? ' · wpadła do wody 💦' : ''));
    lines.push('Monety: <b>+' + fmt(coins) + ' 🪙</b>' + (lastZone.coin > 1.2 ? ' (idealny kąt ×1,3)' : ''));

    if (ball.birds > 0) {
      var bb = Math.round(40 * W.earn * ball.birds);
      coins += bb;
      lines.push('🐦 Trafione ptaki: <b>' + ball.birds + '</b> · <b>+' + fmt(bb) + ' 🪙</b>');
    }
    if (ball.trees > 0) lines.push('🔥 Zniszczone drzewa: <b>' + ball.trees + '</b>');
    if (res === 'hole') {
      var bonus = Math.round(HOLE_BONUS[ball.holeIdx] * W.earn);
      coins += bonus;
      title = HOLE_NAMES[ball.holeIdx] + '! ⛳';
      lines.push('Trafiony dołek <b>' + HOLE_NAMES[ball.holeIdx] + '</b>: <b>+' + fmt(bonus) + ' 🪙</b>');
    }
    if (dist > save.best[wi]) {
      if (save.best[wi] > 0) lines.push('🏆 <b>Nowy rekord!</b>');
      save.best[wi] = dist;
    }
    if (dist >= W.orbit) {
      if (!save.orbits[wi]) {
        save.orbits[wi] = true;
        var ob = Math.round(3000 * W.earn);
        coins += ob; save.gems += 8;
        title = 'ORBITA! 🚀';
        lines.push('🚀 <b>Orbita osiągnięta!</b> +' + fmt(ob) + ' 🪙 +8 💎');
        if (wi + 1 < WORLDS.length && save.unlocked < wi + 1) {
          save.unlocked = wi + 1;
          lines.push('🌍 Odblokowano świat: <b>' + WORLDS[wi + 1].name + '</b>');
        }
      } else {
        save.gems += 1;
        lines.push('🚀 Orbita! <b>+1 💎</b>');
      }
    }
    save.coins += coins;
    save.shots += 1;
    writeSave();
    updateHud();
    $('r-title').textContent = title;
    var onGreen = res === 'stop' && greenIdx(ball.x) >= 0;
    if (onGreen) lines.push('⛳ Piłka na zielonym! Możesz zrobić <b>dobitkę</b>.');
    offerPutt(onGreen);
    $('r-lines').innerHTML = lines.join('<br>');
    $('result').classList.add('is-visible');
  }

  function spawnSplash(x, y, v) {
    for (var i = 0; i < 14; i++) {
      var a = Math.PI * (0.25 + 0.5 * Math.random());
      var sp = 3 + Math.random() * clamp(v * 0.25, 2, 9);
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp * (Math.random() < 0.5 ? -1 : 1) * 0.6, vy: Math.sin(a) * sp, t: 0, life: 0.9, col: '#d9f1ff', r: 0.25, g: 12 });
    }
  }
  function spawnFeathers(x, y) {
    for (var i = 0; i < 10; i++) {
      particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 8, vy: Math.random() * 6, t: 0, life: 1.1, col: '#f5f5f5', r: 0.22, g: 4 });
    }
  }

  var FIRE_COLS = ['#ff3b30', '#ff9500', '#ffd60a'];
  function spawnFire() {
    var sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    var cnt = clamp(Math.round(sp / 25), 2, 6);
    for (var i = 0; i < cnt && particles.length < 500; i++) {
      particles.push({ x: ball.x + (Math.random() - 0.5) * 0.5, y: ball.y + (Math.random() - 0.5) * 0.5,
        vx: -ball.vx * 0.04 + (Math.random() - 0.5) * 4, vy: -ball.vy * 0.04 + (Math.random() - 0.5) * 4,
        t: 0, life: 0.45 + Math.random() * 0.55, col: FIRE_COLS[Math.floor(Math.random() * 3)], r: 0.25 + Math.random() * 0.3, g: -1, px: 3 });
    }
  }
  function spawnBurst(x, y, perfect) {
    for (var i = 0; i < (perfect ? 26 : 8); i++) {
      var a = Math.random() * Math.PI, sp = 3 + Math.random() * 10;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.7, t: 0, life: 0.5 + Math.random() * 0.4,
        col: perfect ? FIRE_COLS[Math.floor(Math.random() * 3)] : '#ffffff', r: 0.2 + Math.random() * 0.25, g: 6, px: 3 });
    }
  }
  function spawnCrash(c) {
    var cols = ['#2fb85f', '#1f8f46', '#7a5230', '#9c6b3f'];
    for (var i = 0; i < 24; i++) {
      particles.push({ x: c.x + (Math.random() - 0.5) * 2, y: c.y + (Math.random() - 0.5) * 4, vx: (Math.random() - 0.5) * 16, vy: 2 + Math.random() * 12,
        t: 0, life: 1.1, col: cols[Math.floor(Math.random() * cols.length)], r: 0.3 + Math.random() * 0.3, g: 14, px: 3 });
    }
  }

  function update(dt) {
    clock += dt;
    if (state === 'ready') {
      swingT += dt;
      var tri = 1 - Math.abs(((swingT * 0.8) % 2) - 1);
      theta = ANG_MIN + (ANG_MAX - ANG_MIN) * tri;
    }
    if (state === 'putt') puttT += dt;
    if (state === 'swing') {
      swingClock += dt;
      golfSwing = clamp(swingClock / swingDur, 0, 1);
      if (swingClock >= swingDur * 0.8) doLaunch();
    } else if (golfSwing < 1 && state !== 'ready') golfSwing = Math.min(1, golfSwing + dt / swingDur);
    if (state === 'flight') {
      // Fast-forward the boring high part of a long flight, but never the
      // landing and roll: the factor eases (no sudden jump near the ground).
      var bspd = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy), balt = Math.max(ball.y - groundY(W, ball.x), 0), tgt;
      if (balt > 40) tgt = ball.t < 3 ? 1 : (ball.t < 8 ? 2.5 : 5);
      else if (balt > 5) tgt = 1.5;
      else tgt = clamp(bspd / 30, 1, 3);
      timeScale += (tgt - timeScale) * Math.min(1, dt * 3);
      var scale = timeScale;
      acc += dt * scale;
      var guard = 0, res = null;
      while (acc >= DT && !res && guard++ < 500) {
        acc -= DT;
        res = stepBall(ball, W, P, DT);
        trailT += DT;
        if (trailT > 0.05 * scale) { trailT = 0; trail.push({ x: ball.x, y: ball.y }); if (trail.length > 90) trail.shift(); }
        if (ball.splash) { spawnSplash(ball.splash.x, ball.splash.y, ball.splash.v); ball.splash = null; }
        if (ball.feather) { spawnFeathers(ball.feather.x, ball.feather.y); ball.feather = null; banner('Ptak! 🐦'); }
      }
      if (ball.crash) { spawnCrash(ball.crash); ball.crash = null; banner('Drzewo zniszczone! 💥'); }
      if (ball.fire) spawnFire();
      $('dist-big').textContent = fmt(Math.max(0, ball.x)) + ' m';
      setGoalBar(ball.x);
      if (res) { if (ball.putt) finishPutt(res); else finishShot(res); }
    }
    for (var pi = particles.length - 1; pi >= 0; pi--) {
      var pt = particles[pi];

    var flying = state === 'flight', gb = groundY(W, ball.x), alt = Math.max(ball.y - gb, 0);
    cam.alt += (alt - cam.alt) * Math.min(1, dt * 6);

      if (swingPerfect) {

      } else z = 1 + 0.1 * smooth(swingClock / imp);

      return;
    }
    var ppm, gf, cx;
    if (state === 'ready') {
      ppm = readyPpm(); gf = 0.8; cx = -0.5 * VW / ppm;
    } else if (state === 'putt') { // frame the ball and the hole
      ppm = clamp(VW / (puttInfo.d + 14), 10, 60); gf = 0.7;
      cx = (ball.x + W.holes[puttInfo.hi]) / 2 - 0.5 * VW / ppm;
    } else {
      ppm = Math.min(VW / 26, 0.72 * VH / (alt + 8));
      gf = 0.66 + 0.2 * clamp(alt / 25, 0, 1);
      cx = ball.x - 0.28 * VW / cam.ppm;
    }
    cam.ppm += (ppm - cam.ppm) * Math.min(1, dt * (flying ? 7 : 4));
    cam.x += ((state === 'ready' ? -0.5 * VW / cam.ppm : cx) - cam.x) * Math.min(1, dt * (flying ? 14 : 5));
    cam.y += (gb + (gf - 0.66) * VH / cam.ppm - cam.y) * Math.min(1, dt * (flying ? 10 : 5));

    cam.curve = smooth((cam.alt - 60) / 300);
    if (state === 'ready') cam.curve = 0;
  }

  // ---------- Drawing ----------

  function hex(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }
  function mix(c1, c2, t) {
    var a = hex(c1), b = hex(c2);
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }

  function drawBird(x, y, s, flap, col) {
    ctx.strokeStyle = col || '#37474f'; ctx.lineWidth = Math.max(1.5, s * 0.16); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s, y - s * 0.2 * flap);
    ctx.quadraticCurveTo(x - s * 0.5, y - s * 0.8 * flap, x, y);
    ctx.quadraticCurveTo(x + s * 0.5, y - s * 0.8 * flap, x + s, y - s * 0.2 * flap);
    ctx.stroke();
  }

  // Big cartoon bird (faces right): body, belly, beak, eye, flapping wings.
  function drawBigBird(x, y, u, flap) {
    var w = flap * 0.9; // -0.9 .. 0.9: wings down .. up
    ctx.save(); ctx.translate(x, y); ctx.lineJoin = 'round';
    // far wing
    ctx.fillStyle = '#3a6ea5';
    ctx.beginPath(); ctx.moveTo(-0.3 * u, -0.1 * u); ctx.quadraticCurveTo(-1.0 * u, -(0.3 + w) * u, -1.8 * u, -(0.1 + w * 1.3) * u);
    ctx.quadraticCurveTo(-1.1 * u, 0.1 * u, -0.1 * u, 0.2 * u); ctx.closePath(); ctx.fill();
    // tail
    ctx.fillStyle = '#2d557f'; ctx.beginPath(); ctx.moveTo(-0.9 * u, 0); ctx.lineTo(-1.7 * u, 0.15 * u); ctx.lineTo(-1.5 * u, 0.5 * u); ctx.lineTo(-0.8 * u, 0.35 * u); ctx.closePath(); ctx.fill();
    // body
    ctx.fillStyle = '#4a86c5'; ctx.beginPath(); ctx.ellipse(0, 0.1 * u, 1.0 * u, 0.62 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f4f1e8'; ctx.beginPath(); ctx.ellipse(0.1 * u, 0.32 * u, 0.7 * u, 0.34 * u, 0, 0, Math.PI * 2); ctx.fill();
    // head
    ctx.fillStyle = '#4a86c5'; ctx.beginPath(); ctx.arc(0.85 * u, -0.25 * u, 0.5 * u, 0, Math.PI * 2); ctx.fill();
    // beak
    ctx.fillStyle = '#ffb21e'; ctx.beginPath(); ctx.moveTo(1.25 * u, -0.35 * u); ctx.lineTo(1.85 * u, -0.12 * u); ctx.lineTo(1.25 * u, -0.05 * u); ctx.closePath(); ctx.fill();
    // eye
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(1.0 * u, -0.38 * u, 0.17 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(1.05 * u, -0.38 * u, 0.08 * u, 0, Math.PI * 2); ctx.fill();
    // near wing (flaps)
    ctx.fillStyle = '#5b9bd9';
    ctx.beginPath(); ctx.moveTo(0.1 * u, 0); ctx.quadraticCurveTo(-0.5 * u, -(0.5 + w * 1.2) * u, -1.3 * u, -(0.25 + w * 1.7) * u);
    ctx.quadraticCurveTo(-0.9 * u, 0.2 * u, 0.4 * u, 0.3 * u); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawTree(kind, sx, sy, w, h, ppm) {
    var pw = w * ppm, ph = h * ppm;
    if (kind === 'tree') {
      ctx.fillStyle = '#7a5230'; ctx.fillRect(sx - pw * 0.13, sy - ph * 0.55, pw * 0.26, ph * 0.55);
      ctx.fillStyle = '#1f8f46';
      ctx.beginPath(); ctx.arc(sx, sy - ph * 0.7, pw * 0.5, 0, Math.PI * 2); ctx.arc(sx - pw * 0.32, sy - ph * 0.58, pw * 0.36, 0, Math.PI * 2); ctx.arc(sx + pw * 0.32, sy - ph * 0.58, pw * 0.36, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2fb85f'; ctx.beginPath(); ctx.arc(sx - pw * 0.12, sy - ph * 0.78, pw * 0.3, 0, Math.PI * 2); ctx.fill();
    } else if (kind === 'cactus') {
      ctx.fillStyle = '#2f9a55';
      ctx.fillRect(sx - pw * 0.2, sy - ph, pw * 0.4, ph);
      ctx.fillRect(sx - pw * 0.75, sy - ph * 0.6, pw * 0.55, pw * 0.22);
      ctx.fillRect(sx - pw * 0.75, sy - ph * 0.85, pw * 0.22, ph * 0.3);
      ctx.fillRect(sx + pw * 0.2, sy - ph * 0.45, pw * 0.55, pw * 0.22);
      ctx.fillRect(sx + pw * 0.53, sy - ph * 0.7, pw * 0.22, ph * 0.3);
      ctx.fillStyle = '#58c97c'; ctx.fillRect(sx - pw * 0.1, sy - ph, pw * 0.1, ph);
    } else if (kind === 'pine') {
      ctx.fillStyle = '#5d4037'; ctx.fillRect(sx - pw * 0.1, sy - ph * 0.2, pw * 0.2, ph * 0.2);
      for (var i = 0; i < 3; i++) {
        var y1 = sy - ph * (0.15 + i * 0.28), wd = pw * (0.95 - i * 0.22);
        ctx.fillStyle = i % 2 ? '#2a8f5c' : '#1e6b45';
        ctx.beginPath(); ctx.moveTo(sx - wd, y1); ctx.lineTo(sx + wd, y1); ctx.lineTo(sx, y1 - ph * 0.42); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(sx - wd * 0.4, y1 - ph * 0.26); ctx.lineTo(sx + wd * 0.4, y1 - ph * 0.26); ctx.lineTo(sx, y1 - ph * 0.42); ctx.closePath(); ctx.fill();
      }

      ctx.fillStyle = '#8a8d94'; ctx.beginPath(); ctx.moveTo(sx - pw * 0.35, sy - ph * 0.7); ctx.lineTo(sx + pw * 0.3, sy - ph); ctx.lineTo(sx, sy - ph * 0.3); ctx.closePath(); ctx.fill();
    }
  }

  function drawHouse(kind, v, sx, sy, s) {
    var wall = kind === 'adobe' ? '#e0b583' : (kind === 'cabin' ? '#8d5a3b' : ['#fff1d6', '#d9ecff', '#ffe0e0'][v]);
    var roof = kind === 'adobe' ? '#c46b3a' : (kind === 'cabin' ? '#e8f1f8' : ['#d9534f', '#3b6fb6', '#8a5a9c'][v]);
    var w = 7 * s, h = 4.2 * s;
    ctx.fillStyle = wall; ctx.fillRect(sx - w / 2, sy - h, w, h);
    ctx.fillStyle = roof;
    if (kind === 'adobe') { ctx.fillRect(sx - w / 2 - 0.3 * s, sy - h - 0.6 * s, w + 0.6 * s, 0.8 * s); }
    else { ctx.beginPath(); ctx.moveTo(sx - w / 2 - 0.6 * s, sy - h); ctx.lineTo(sx, sy - h - 3.2 * s); ctx.lineTo(sx + w / 2 + 0.6 * s, sy - h); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = '#7a4a2a'; ctx.fillRect(sx - 0.7 * s, sy - 2.2 * s, 1.4 * s, 2.2 * s);
    ctx.fillStyle = '#9fd8ff'; ctx.fillRect(sx - w / 2 + 0.7 * s, sy - 3.2 * s, 1.5 * s, 1.5 * s); ctx.fillRect(sx + w / 2 - 2.2 * s, sy - 3.2 * s, 1.5 * s, 1.5 * s);
    if (kind !== 'adobe') { ctx.fillStyle = '#a04030'; ctx.fillRect(sx + w * 0.22, sy - h - 2.6 * s, 0.9 * s, 1.6 * s); }
  }

  // Club angle over the swing: address (t<0), back-swing, down-swing hitting the
  // ball at t=0.8, then follow-through.
  function clubAngle(t) {
    if (t < 0) return -0.29;
    if (t < 0.55) return -0.29 + 3.0 * (1 - Math.pow(1 - t / 0.55, 2));
    if (t < 0.8) { var u = (t - 0.55) / 0.25; return 2.71 - 3.0 * u * u; }
    return -0.29 - 1.7 * smooth((t - 0.8) / 0.2);
  }

  // Cartoon golfer (facing right). u = pixels per metre; feet at (sx, sy).
  function drawGolfer(sx, sy, u, skin, t) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // shoes
    ctx.fillStyle = '#b3362b';
    ctx.beginPath(); ctx.ellipse(-0.45 * u, -0.1 * u, 0.42 * u, 0.2 * u, 0, 0, Math.PI * 2); ctx.ellipse(0.45 * u, -0.1 * u, 0.42 * u, 0.2 * u, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#f4f1e8'; ctx.fillRect(-0.65 * u, -1.05 * u, 0.4 * u, 0.9 * u); ctx.fillRect(0.28 * u, -1.05 * u, 0.4 * u, 0.9 * u);

      ctx.beginPath(); ctx.moveTo(d[0] * u, (d[1] - 0.16) * u); ctx.lineTo((d[0] + 0.12) * u, d[1] * u); ctx.lineTo(d[0] * u, (d[1] + 0.16) * u); ctx.lineTo((d[0] - 0.12) * u, d[1] * u); ctx.closePath(); ctx.fill();
    });
    // knickers
    ctx.fillStyle = '#35669e'; ctx.fillRect(-0.72 * u, -1.75 * u, 1.5 * u, 0.8 * u);
    ctx.fillStyle = '#2b5686'; ctx.fillRect(-0.05 * u, -1.75 * u, 0.1 * u, 0.8 * u);
    // vest with argyle
    ctx.fillStyle = skin.shirt; ctx.beginPath(); ctx.moveTo(-0.7 * u, -1.7 * u); ctx.lineTo(0.78 * u, -1.7 * u); ctx.lineTo(0.7 * u, -2.9 * u); ctx.lineTo(-0.62 * u, -2.9 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(30,60,120,0.55)';

      ctx.beginPath(); ctx.moveTo(d[0] * u, (d[1] - 0.2) * u); ctx.lineTo((d[0] + 0.16) * u, d[1] * u); ctx.lineTo(d[0] * u, (d[1] + 0.2) * u); ctx.lineTo((d[0] - 0.16) * u, d[1] * u); ctx.closePath(); ctx.fill();
    });

    if (ball.fire) { // burning ball glow
      var fg = ctx.createRadialGradient(bx, by, br * 0.3, bx, by, br * 3.4);
      fg.addColorStop(0, 'rgba(255,210,60,0.95)'); fg.addColorStop(0.5, 'rgba(255,110,20,0.5)'); fg.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = fg; ctx.fillRect(bx - br * 3.4, by - br * 3.4, br * 6.8, br * 6.8);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(bx, syw(groundY(W, ball.x), ball.x) + 1, br, br * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = curBall().color; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(bx - br * 0.3, by - br * 0.3, br * 0.28, 0, Math.PI * 2); ctx.fill();
    for (i = 0; i < particles.length; i++) {
      var pt = particles[i];
      ctx.globalAlpha = clamp(1 - pt.t / pt.life, 0, 1);
      ctx.fillStyle = pt.col; ctx.beginPath(); ctx.arc(sx(pt.x), syw(pt.y, pt.x), Math.max(pt.px || 2, pt.r * ppm), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // --- foreground grass tufts ---
    if (W.id !== 'moon') {
      ctx.strokeStyle = W.id === 'snow' ? 'rgba(255,255,255,0.8)' : 'rgba(34,140,60,0.9)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      var tuft = Math.max(8, 1.6 * ppm), j0 = Math.floor(x0 * ppm / (tuft * 4));
      for (var j = j0; j * tuft * 4 / ppm < x1; j++) {
        var tx = j * tuft * 4 / ppm + hash(j, 5, 5) * 2;
        if (surfaceAt(W, tx)) continue;
        var tsx = sx(tx), tsy = syw(groundY(W, tx), tx), th = (0.3 + hash(j, 6, 6) * 0.4) * Math.min(ppm, 40);
        ctx.beginPath(); ctx.moveTo(tsx, tsy + 1); ctx.lineTo(tsx - 3, tsy - th); ctx.moveTo(tsx, tsy + 1); ctx.lineTo(tsx + 3, tsy - th * 1.2); ctx.moveTo(tsx, tsy + 1); ctx.lineTo(tsx, tsy - th * 1.4); ctx.stroke();
      }
    }

    // --- putt power meter ---
    if (state === 'putt' && puttInfo) {
      var mw = Math.min(0.56 * VW, 340), mh = 24, mx0 = (VW - mw) / 2, my0 = VH * 0.82;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(mx0 - 4, my0 - 4, mw + 8, mh + 8);
      ctx.fillStyle = '#e8453c'; ctx.fillRect(mx0, my0, mw, mh);
      ctx.fillStyle = '#35d36b'; ctx.fillRect(mx0 + mw * puttInfo.lo / puttInfo.vmax, my0, mw * (puttInfo.up - puttInfo.lo) / puttInfo.vmax, mh);
      var mk = mx0 + mw * puttPower();
      ctx.fillStyle = '#fff'; ctx.fillRect(mk - 3, my0 - 8, 6, mh + 16);
      ctx.font = '900 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.fillText('DOBITKA — dotknij, gdy znacznik jest w zielonym', VW / 2, my0 - 14);
    }

    // --- swing gauge next to the ball ---
    if (state === 'ready' || state === 'swing') {
      var R = clamp(0.34 * VH, 80, 0.46 * VW);
      drawGauge(bx + 10, by + br * 0.4, R, theta);
    }
  }

  // ---------- Upgrades (cards on the left) ----------

  var UPG = [
    { id: 'str', icon: '💪', name: 'SIŁA', desc: function (l) { return 'Golfer silniejszy o ' + (l * 12) + '%'; } },
    { id: 'spd', icon: '⚡', name: 'SZYBKOŚĆ', desc: function (l) { return 'Piłka szybsza o ' + (l * 5) + '%'; } },
    { id: 'bnc', icon: '🏀', name: 'ODBICIE', desc: function (l) { return 'Odbicia dalsze o ' + (l * 5) + '%'; } },
  ];
  var upgBuilt = false;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildUpgrades() {
    var panel = $('upg-panel');
    panel.innerHTML = '';
    UPG.forEach(function (u) {
      var card = el('div', 'upg k-' + u.id);
      card.id = 'upg-' + u.id;
      var main = el('div', 'u-main');
      main.appendChild(el('div', 'u-ico', u.icon));
      var text = el('div', 'u-text');
      var title = el('div', 'u-title');
      title.appendChild(el('span', 'u-name', u.name));
      var price = el('span', 'u-price');
      price.appendChild(el('span', 'coin-ico'));
      price.appendChild(el('span', 'u-cost', '0'));
      title.appendChild(price);
      text.appendChild(title);
      text.appendChild(el('div', 'u-sub', ''));
      main.appendChild(text);
      var btn = el('button', 'u-btn');
      btn.type = 'button';
      btn.innerHTML = 'ULEPSZ<b></b>';
      btn.addEventListener('click', function () { buyUpgrade(u.id); });
      card.appendChild(main); card.appendChild(btn);
      panel.appendChild(card);
    });
    upgBuilt = true;
  }

  function renderUpgrades() {
    if (!upgBuilt) buildUpgrades();
    UPG.forEach(function (u) {
      var lv = save.up[u.id], max = lv >= MAXLV, cost = upgradeCost(lv), can = !max && save.coins >= cost;
      var card = $('upg-' + u.id);
      card.querySelector('.u-cost').textContent = max ? 'MAX' : fmtShort(cost);
      card.querySelector('.u-sub').textContent = u.desc(lv) + ' · poz. ' + lv;
      var btn = card.querySelector('.u-btn');
      btn.disabled = !can;
      btn.className = 'u-btn' + (can ? ' is-ready' : '');
      btn.querySelector('b').textContent = max ? '—' : '+1';
    });
  }

  function buyUpgrade(id) {
    var lv = save.up[id], cost = upgradeCost(lv);
    if (lv >= MAXLV || save.coins < cost) return;
    save.coins -= cost; save.up[id] += 1;
    writeSave();
    if (state === 'ready') P = statsFor(W, save.up, curBall());
    updateHud();
  }

  // ---------- Shop (Szatnia) ----------

  var shopTab = 'skin';
  function rowFor(icon, titleText, descText, btn, selected, swatch) {
    var row = el('div', 'row' + (selected ? ' is-sel' : ''));
    if (swatch) { var sw = el('div', 'swatch'); sw.style.background = swatch; row.appendChild(sw); }
    else row.appendChild(el('div', 'ico', icon));
    var info = el('div', 'info');
    info.appendChild(el('b', '', titleText));
    info.appendChild(el('span', '', descText));
    row.appendChild(info);
    if (btn) row.appendChild(btn);
    return row;
  }
  function buyBtn(label, enabled, handler) {
    var b = el('button', 'btn btn--small', label);
    b.type = 'button'; b.disabled = !enabled;
    if (enabled) b.addEventListener('click', handler);
    return b;
  }

  function renderShop() {
    var tabs = $('shop-tabs'), body = $('shop-body');
    tabs.innerHTML = ''; body.innerHTML = '';
    [['skin', 'Golfiści'], ['ball', 'Piłki'], ['world', 'Światy']].forEach(function (t) {
      var b = el('button', 'tab' + (shopTab === t[0] ? ' is-active' : ''), t[1]);
      b.type = 'button';
      b.addEventListener('click', function () { shopTab = t[0]; renderShop(); });
      tabs.appendChild(b);
    });
    if (shopTab === 'ball') {
      BALLS.forEach(function (b) {
        var owned = save.balls.owned.indexOf(b.id) >= 0, sel = save.balls.sel === b.id, btn;
        if (owned) btn = buyBtn(sel ? 'Wybrana' : 'Wybierz', !sel, function () { save.balls.sel = b.id; writeSave(); renderShop(); });
        else btn = buyBtn('Kup 💎 ' + b.price, save.gems >= b.price, function () {
          save.gems -= b.price; save.balls.owned.push(b.id); save.balls.sel = b.id; writeSave(); updateHud(); renderShop();
        });
        body.appendChild(rowFor('', b.name, b.desc, btn, sel, b.color));
      });
      body.appendChild(el('div', 'info', 'Diamenty 💎 zdobywasz na kole szczęścia i za orbity.'));
    } else if (shopTab === 'skin') {
      SKINS.forEach(function (s, idx) {
        var owned = save.skins.owned.indexOf(idx) >= 0, sel = save.skins.sel === idx, btn;
        if (owned) btn = buyBtn(sel ? 'Wybrany' : 'Wybierz', !sel, function () { save.skins.sel = idx; writeSave(); renderShop(); });
        else btn = buyBtn('Kup 🪙 ' + fmt(s.price), save.coins >= s.price, function () {
          save.coins -= s.price; save.skins.owned.push(idx); save.skins.sel = idx; writeSave(); updateHud(); renderShop();
        });
        body.appendChild(rowFor('', s.name, 'Czapka i kamizelka', btn, sel, s.cap));
      });
    } else {
      WORLDS.forEach(function (w, idx) {
        var open = idx <= save.unlocked, sel = save.world === idx, btn;
        if (open) btn = buyBtn(sel ? 'Tu grasz' : 'Graj tutaj', !sel, function () { setWorld(idx); $('shop').classList.remove('is-open'); });
        else btn = buyBtn('🔒', false, null);
        var icon = ['🌳', '🏜️', '❄️', '🌕'][idx];
        var desc = open ? 'Orbita: ' + fmt(w.orbit) + ' m · rekord ' + fmt(save.best[idx]) + ' m · zarobki ×' + w.earn
          : 'Osiągnij orbitę w poprzednim świecie';
        body.appendChild(rowFor(icon, w.name, desc, btn, sel));
      });
    }
  }

  function openShop(tab) {
    if (tab) shopTab = tab;
    renderShop();
    $('shop').classList.add('is-open');
  }

  // ---------- Lucky wheel (the gift button) ----------

  var WHEEL = [
    { k: 'c', m: 1, w: 30, col: '#c0392b' }, { k: 'g', v: 1, w: 18, col: '#2471a3' },
    { k: 'c', m: 2, w: 22, col: '#d68910' }, { k: 'g', v: 2, w: 12, col: '#1a8a9a' },
    { k: 'c', m: 4, w: 10, col: '#7d3c98' }, { k: 'g', v: 3, w: 5, col: '#1e8449' },
    { k: 'c', m: 10, w: 2.5, col: '#b9770e' }, { k: 'g', v: 8, w: 0.5, col: '#8e44ad' },
  ];
  var wheelRot = 0, spinning = false, wheelTimer = null;
  function wheelCoins(seg) { return Math.round(120 * seg.m * (1 + 0.35 * sumLevels())); }
  function segText(seg) { return seg.k === 'c' ? '🪙' + fmt(wheelCoins(seg)) : '💎' + seg.v; }

  function giftText() {
    var left = save.wheelAt - Date.now();
    if (left <= 0) return '';
    var s = Math.ceil(left / 1000);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function updateGift() {
    var t = giftText(), b = $('b-gift');
    $('gift-timer').textContent = t || 'GOTOWE!';
    b.classList.toggle('is-ready', !t);
  }

  function buildWheel() {
    var wheel = $('wheel');
    var stops = [];
    WHEEL.forEach(function (s, i) { stops.push(s.col + ' ' + (i * 45) + 'deg ' + ((i + 1) * 45) + 'deg'); });
    wheel.style.background = 'conic-gradient(' + stops.join(',') + ')';
    wheel.innerHTML = '';
    WHEEL.forEach(function (s, i) {
      var lab = el('div', 'wheel-label', segText(s));
      var ang = i * 45 + 22.5;
      lab.style.transform = 'rotate(' + ang + 'deg) translateY(-88px) rotate(' + (-ang) + 'deg)';
      wheel.appendChild(lab);
    });
  }

  function wheelUi() {
    var btn = $('wheel-spin');
    if (spinning) { btn.disabled = true; btn.textContent = 'Kręci się…'; return; }
    var t = giftText();
    if (t) { btn.disabled = true; btn.textContent = 'Następne za ' + t; }
    else { btn.disabled = false; btn.textContent = 'Zakręć!'; }
  }

  function openWheel() {
    buildWheel();
    $('wheel-msg').textContent = '';
    $('wheelm').classList.add('is-open');
    wheelUi();
    if (wheelTimer) clearInterval(wheelTimer);
    wheelTimer = setInterval(function () { wheelUi(); updateGift(); }, 500);
  }
  function closeWheel() {
    $('wheelm').classList.remove('is-open');
    if (wheelTimer) { clearInterval(wheelTimer); wheelTimer = null; }
  }

  function spinWheel() {
    if (spinning || Date.now() < save.wheelAt) return;
    var total = 0, i;
    for (i = 0; i < WHEEL.length; i++) total += WHEEL[i].w;
    var r = Math.random() * total, pick = 0;
    for (i = 0; i < WHEEL.length; i++) { r -= WHEEL[i].w; if (r <= 0) { pick = i; break; } }
    var seg = WHEEL[pick];
    // reward is granted up front so closing the window mid-spin can't dodge it
    if (seg.k === 'c') save.coins += wheelCoins(seg); else save.gems += seg.v;
    save.wheelAt = Date.now() + 15 * 60 * 1000;
    writeSave();
    spinning = true;
    var centre = pick * 45 + 22.5;
    var cur = ((wheelRot % 360) + 360) % 360;
    wheelRot += 360 * 5 + ((360 - centre - cur) % 360 + 360) % 360;
    $('wheel').style.transform = 'rotate(' + wheelRot + 'deg)';
    $('wheel-msg').textContent = '';
    wheelUi();
    setTimeout(function () {
      spinning = false;
      $('wheel-msg').textContent = 'Wygrywasz: ' + segText(seg) + '!';
      updateHud();
      wheelUi();
    }, 4200);
  }

  // ---------- Input & wiring ----------

  function anyModal() { return $('shop').classList.contains('is-open') || $('wheelm').classList.contains('is-open'); }
  function tap() {
    if (anyModal() || performance.now() < readyAt) return;
    if (state === 'ready') beginSwing();
    else if (state === 'putt') doPutt();
    else if (state === 'result' && !$('result').classList.contains('is-visible')) resetShot(); // after the upgrade detour
  }
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); tap(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') {
      if ($('screen-game').classList.contains('is-active') && state !== 'flight' && !anyModal()) { e.preventDefault(); tap(); }
    }
  });

  $('btn-play').addEventListener('click', function () {
    save = loadSave();
    showScreen('game');
    resetShot();
  });
  $('btn-reset').addEventListener('click', function () {
    if (save.shots > 0 && !confirm('Zacząć od nowa? Stracisz cały zapisany postęp.')) return;
    save = freshSave(); writeSave(); refreshMenu();
  });
  $('btn-gear').addEventListener('click', function () { refreshMenu(); showScreen('menu'); });
  $('b-club').addEventListener('click', function () { openShop('skin'); });
  $('b-star').addEventListener('click', function () { openShop('world'); });
  $('r-shop').addEventListener('click', function () { $('result').classList.remove('is-visible'); banner('Ulepszaj, potem dotknij ekran'); });
  $('shop-close').addEventListener('click', function () { $('shop').classList.remove('is-open'); updateHud(); });
  $('b-gift').addEventListener('click', openWheel);
  $('wheel-close').addEventListener('click', closeWheel);
  $('wheel-spin').addEventListener('click', spinWheel);
  $('r-next').addEventListener('click', function () { resetShot(); });
  $('r-putt').addEventListener('click', startPutt);
  window.addEventListener('resize', resize);
  setInterval(function () { if ($('screen-game').classList.contains('is-active')) updateGift(); }, 1000);

  var lastTs = null;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!$('screen-game').classList.contains('is-active')) { lastTs = null; return; }
    if (stage.clientWidth !== VW || stage.clientHeight !== VH) resize();
    if (lastTs === null) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    update(dt);
    draw();
  }

  refreshMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

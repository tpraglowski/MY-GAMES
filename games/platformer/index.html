<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Platformówka</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; background: #0f1117; color: #f0f0f5; }

  #start-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1.5rem; text-align: center; }
  #start-screen.is-hidden { display: none; }
  #start-screen h1 { margin: 0; font-size: 1.4rem; }
  #start-screen p { margin: 0; color: #9a9db0; font-size: 0.85rem; max-width: 320px; line-height: 1.5; }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.6rem 1.4rem; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; background: #6c5ce7; color: #fff; }

  #game-screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #game-screen.is-active { display: flex; }

  #hud { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.8rem; background: #0a0c14; border-bottom: 1px solid #23273a; font-size: 0.75rem; }
  #hud button { background: transparent; border: 1px solid #2a2e3f; color: #9a9db0; border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.7rem; cursor: pointer; }

  #canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 0; padding: 0.5rem; }
  #game-canvas { max-width: 100%; max-height: 100%; background: linear-gradient(#4a90d9, #bfe3ff); border-radius: 8px; image-rendering: pixelated; touch-action: none; }

  #message-overlay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(10,12,20,0.9); border-radius: 12px; padding: 1rem 1.6rem; text-align: center; display: none; }
  #message-overlay.is-visible { display: block; }
  #message-overlay h2 { margin: 0 0 0.4rem; font-size: 1.1rem; }
  #message-overlay p { margin: 0; font-size: 0.8rem; color: #9a9db0; }

  #touch-controls { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 1rem 1rem; }
  #touch-controls .side { display: flex; gap: 0.6rem; }
  #touch-controls button { width: 56px; height: 56px; border-radius: 14px; border: none; background: rgba(255,255,255,0.08); color: #f0f0f5; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; }
  #touch-controls button:active, #touch-controls button.is-active { background: #6c5ce7; }
  #btn-jump { width: 72px; height: 72px; font-size: 0.85rem; font-weight: 700; }
</style>
</head>
<body>

<div id="start-screen">
  <h1>🏃 Platformówka</h1>
  <p>
    Sterowanie: strzałki / A D — ruch, spacja / strzałka w górę — skok.<br>
    Omijaj kolce i lawę, dotrzyj do flagi na końcu każdego poziomu. 3 poziomy, coraz trudniejsze!
  </p>
  <button class="btn" id="start-btn" type="button">Start →</button>
</div>

<div id="game-screen">
  <div id="hud">
    <span id="level-label">Poziom 1 / 3</span>
    <button type="button" id="restart-btn">Od nowa</button>
  </div>

  <div id="canvas-wrap">
    <canvas id="game-canvas" width="480" height="360"></canvas>
    <div id="message-overlay">
      <h2 id="message-title"></h2>
      <p id="message-text"></p>
    </div>
  </div>

  <div id="touch-controls">
    <div class="side">
      <button type="button" id="btn-left" aria-label="Lewo">◀</button>
      <button type="button" id="btn-right" aria-label="Prawo">▶</button>
    </div>
    <button type="button" id="btn-jump" aria-label="Skok">SKOK</button>
  </div>
</div>

<script>
(function () {
  var CANVAS_W = 480, CANVAS_H = 360;
  var GRAVITY = 1400, JUMP_VELOCITY = -480, MOVE_SPEED = 190;
  var PLAYER_W = 26, PLAYER_H = 26;

  var LEVELS = [
    {
      spawn: { x: 30, y: 300 },
      platforms: [
        { x: 0, y: 330, w: 120, h: 30 },
        { x: 190, y: 330, w: 110, h: 30 },
        { x: 370, y: 330, w: 110, h: 30 },
      ],
      spikes: [
        { x: 210, y: 310, w: 20, h: 20 },
      ],
      lava: [
        { x: 120, y: 345, w: 70, h: 15 },
      ],
      flag: { x: 440, y: 290, w: 16, h: 40 },
    },
    {
      spawn: { x: 20, y: 300 },
      platforms: [
        { x: 0, y: 330, w: 90, h: 30 },
        { x: 140, y: 290, w: 80, h: 20 },
        { x: 260, y: 250, w: 80, h: 20 },
        { x: 150, y: 200, w: 70, h: 20 },
        { x: 280, y: 150, w: 80, h: 20 },
        { x: 400, y: 190, w: 80, h: 20 },
      ],
      spikes: [
        { x: 160, y: 180, w: 20, h: 20 },
        { x: 295, y: 130, w: 20, h: 20 },
      ],
      lava: [
        { x: 90, y: 345, w: 50, h: 15 },
      ],
      flag: { x: 440, y: 150, w: 16, h: 40 },
    },
    {
      spawn: { x: 20, y: 300 },
      platforms: [
        { x: 0, y: 330, w: 70, h: 30 },
        { x: 110, y: 300, w: 50, h: 16 },
        { x: 200, y: 260, w: 50, h: 16 },
        { x: 290, y: 220, w: 50, h: 16 },
        { x: 200, y: 180, w: 50, h: 16 },
        { x: 110, y: 140, w: 50, h: 16 },
        { x: 200, y: 100, w: 50, h: 16 },
        { x: 320, y: 100, w: 50, h: 16 },
        { x: 400, y: 140, w: 80, h: 20 },
      ],
      spikes: [
        { x: 120, y: 280, w: 20, h: 20 },
        { x: 210, y: 240, w: 20, h: 20 },
        { x: 300, y: 200, w: 20, h: 20 },
        { x: 210, y: 160, w: 20, h: 20 },
        { x: 120, y: 120, w: 20, h: 20 },
        { x: 210, y: 80, w: 20, h: 20 },
      ],
      lava: [
        { x: 70, y: 345, w: 40, h: 15 },
      ],
      flag: { x: 440, y: 100, w: 16, h: 40 },
    },
  ];

  var startScreen = document.getElementById('start-screen');
  var gameScreen = document.getElementById('game-screen');
  var canvas = document.getElementById('game-canvas');
  var ctx = canvas.getContext('2d');
  var levelLabel = document.getElementById('level-label');
  var restartBtn = document.getElementById('restart-btn');
  var startBtn = document.getElementById('start-btn');
  var overlay = document.getElementById('message-overlay');
  var overlayTitle = document.getElementById('message-title');
  var overlayText = document.getElementById('message-text');

  var levelIndex = 0;
  var player = { x: 0, y: 0, vx: 0, vy: 0, onGround: false };
  var keys = { left: false, right: false, jump: false };
  var lastTime = null;
  var running = false;
  var overlayTimer = null;

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function fillRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function loadLevel(index) {
    var level = LEVELS[index];
    player.x = level.spawn.x;
    player.y = level.spawn.y;
    player.vx = 0;
    player.vy = 0;
    player.onGround = false;
    levelLabel.textContent = 'Poziom ' + (index + 1) + ' / ' + LEVELS.length;
    hideOverlay();
  }

  function respawn() {
    var level = LEVELS[levelIndex];
    player.x = level.spawn.x;
    player.y = level.spawn.y;
    player.vx = 0;
    player.vy = 0;
    flashOverlay('Ała!', 'Wracasz do początku poziomu.', 700);
  }

  function showOverlay(title, text) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlay.classList.add('is-visible');
  }
  function hideOverlay() {
    overlay.classList.remove('is-visible');
    if (overlayTimer) { clearTimeout(overlayTimer); overlayTimer = null; }
  }
  function flashOverlay(title, text, ms) {
    showOverlay(title, text);
    if (overlayTimer) clearTimeout(overlayTimer);
    overlayTimer = setTimeout(hideOverlay, ms);
  }

  function completeLevel() {
    if (levelIndex < LEVELS.length - 1) {
      showOverlay('Poziom ukończony!', 'Za chwilę kolejny poziom…');
      running = false;
      setTimeout(function () {
        levelIndex += 1;
        loadLevel(levelIndex);
        running = true;
        lastTime = null;
        requestAnimationFrame(tick);
      }, 1200);
    } else {
      running = false;
      showOverlay('🎉 Ukończono grę!', 'Przeszedłeś wszystkie 3 poziomy. Kliknij „Od nowa”, żeby zagrać ponownie.');
    }
  }

  function update(dt) {
    var level = LEVELS[levelIndex];

    var dir = 0;
    if (keys.left) dir -= 1;
    if (keys.right) dir += 1;
    player.vx = dir * MOVE_SPEED;

    if (keys.jump && player.onGround) {
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
    }

    player.vy += GRAVITY * dt;

    // Horizontal move + collision
    player.x += player.vx * dt;
    player.x = Math.max(0, Math.min(CANVAS_W - PLAYER_W, player.x));
    level.platforms.forEach(function (p) {
      var box = { x: player.x, y: player.y, w: PLAYER_W, h: PLAYER_H };
      if (rectsOverlap(box, p)) {
        if (player.vx > 0) player.x = p.x - PLAYER_W;
        else if (player.vx < 0) player.x = p.x + p.w;
      }
    });

    // Vertical move + collision
    player.y += player.vy * dt;
    player.onGround = false;
    level.platforms.forEach(function (p) {
      var box = { x: player.x, y: player.y, w: PLAYER_W, h: PLAYER_H };
      if (rectsOverlap(box, p)) {
        if (player.vy > 0) {
          player.y = p.y - PLAYER_H;
          player.vy = 0;
          player.onGround = true;
        } else if (player.vy < 0) {
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    });

    var playerBox = { x: player.x, y: player.y, w: PLAYER_W, h: PLAYER_H };

    if (player.y > CANVAS_H) { respawn(); return; }
    var hit = level.spikes.concat(level.lava).some(function (h) { return rectsOverlap(playerBox, h); });
    if (hit) { respawn(); return; }
    if (rectsOverlap(playerBox, level.flag)) { completeLevel(); }
  }

  function draw() {
    var level = LEVELS[levelIndex];
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

    ctx.fillStyle = '#6b4a2f';
    level.platforms.forEach(function (p) {
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#4caf50';
      ctx.fillRect(p.x, p.y, p.w, 6);
      ctx.fillStyle = '#6b4a2f';
    });

    ctx.fillStyle = '#e74c3c';
    level.lava.forEach(function (l) { ctx.fillRect(l.x, l.y, l.w, l.h); });

    ctx.fillStyle = '#b0b7c3';
    level.spikes.forEach(function (s) {
      ctx.beginPath();
      var teeth = Math.max(1, Math.round(s.w / 10));
      var tw = s.w / teeth;
      for (var i = 0; i < teeth; i++) {
        ctx.moveTo(s.x + i * tw, s.y + s.h);
        ctx.lineTo(s.x + i * tw + tw / 2, s.y);
        ctx.lineTo(s.x + i * tw + tw, s.y + s.h);
      }
      ctx.closePath();
      ctx.fill();
    });

    var f = level.flag;
    ctx.fillStyle = '#8d6e3a';
    ctx.fillRect(f.x, f.y, 3, f.h);
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.moveTo(f.x + 3, f.y);
    ctx.lineTo(f.x + f.w, f.y + 8);
    ctx.lineTo(f.x + 3, f.y + 16);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#000000';
    fillRoundedRect(ctx, player.x, player.y, PLAYER_W, PLAYER_H, 6);

    var eyeCx = player.x + PLAYER_W / 2;
    var eyeCy = player.y + PLAYER_H * 0.4;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(eyeCx, eyeCy, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(eyeCx, eyeCy, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function tick(ts) {
    if (!running) return;
    if (lastTime === null) lastTime = ts;
    var dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(tick);
  }

  function startGame() {
    startScreen.classList.add('is-hidden');
    gameScreen.classList.add('is-active');
    levelIndex = 0;
    loadLevel(0);
    running = true;
    lastTime = null;
    requestAnimationFrame(tick);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', function () {
    running = false;
    startGame();
  });

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.left = true;
    else if (k === 'arrowright' || k === 'd') keys.right = true;
    else if (k === 'arrowup' || k === 'w' || k === ' ') { keys.jump = true; e.preventDefault(); }
  });
  document.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.left = false;
    else if (k === 'arrowright' || k === 'd') keys.right = false;
    else if (k === 'arrowup' || k === 'w' || k === ' ') keys.jump = false;
  });

  function bindTouch(id, key) {
    var btn = document.getElementById(id);
    var press = function (e) { e.preventDefault(); btn.classList.add('is-active'); keys[key] = true; };
    var release = function () { btn.classList.remove('is-active'); keys[key] = false; };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  }
  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');
  bindTouch('btn-jump', 'jump');
})();
</script>
</body>
</html>

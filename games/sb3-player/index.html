<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odtwarzacz Scratch</title>
<!-- The forkphorus library fetches its own assets (fonts, etc.) via URLs
     relative to the page, not to the script's own origin. This makes those
     resolve against forkphorus.github.io regardless of where this page is
     hosted, instead of 404ing against our own site. -->
<base href="https://forkphorus.github.io/">
<link rel="stylesheet" href="https://forkphorus.github.io/phosphorus.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a1d29; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

  #player-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.6rem; background: #1a1d29; color: #f0f0f5; text-align: center; padding: 1rem; }
  #status.is-hidden { display: none; }
  #status.is-error { color: #ff8a80; }
</style>
</head>
<body>
  <div id="player-wrap"></div>
  <div id="status">Ładowanie gry ze Scratcha…</div>

  <script src="https://forkphorus.github.io/lib/scratch-sb1-converter.js"></script>
  <script src="https://forkphorus.github.io/lib/jszip.min.js"></script>
  <script src="https://forkphorus.github.io/lib/fontfaceobserver.standalone.js"></script>
  <script src="https://forkphorus.github.io/lib/canvg.min.js"></script>
  <script src="https://forkphorus.github.io/lib/purify.min.js"></script>
  <script src="https://forkphorus.github.io/phosphorus.dist.js"></script>

  <script>
  (function () {
    var statusEl = document.getElementById('status');
    var wrapEl = document.getElementById('player-wrap');
    var params = new URLSearchParams(location.search);
    var fileUrl = params.get('url');

    function fail(message) {
      statusEl.textContent = message;
      statusEl.classList.add('is-error');
    }

    if (!fileUrl) {
      fail('Brak pliku gry do wczytania.');
      return;
    }
    if (typeof P === 'undefined') {
      fail('Nie udało się wczytać biblioteki odtwarzacza Scratch.');
      return;
    }

    var player = new P.player.Player();
    player.setOptions({ theme: 'dark', focusOnLoad: false });
    player.addControls();
    new P.player.ErrorHandler(player, { container: wrapEl });
    wrapEl.appendChild(player.root);

    function resize() {
      if (!player.hasStage()) return;
      var zoom = Math.min(
        (wrapEl.clientWidth - 2) / 480,
        (wrapEl.clientHeight - player.controlsContainer.offsetHeight - 2) / 360
      );
      player.stage.setZoom(Math.max(0.1, zoom));
    }

    player.onload.subscribe(function () {
      statusEl.classList.add('is-hidden');
      resize();
    });
    window.addEventListener('resize', resize);

    fetch(fileUrl)
      .then(function (res) {
        if (!res.ok) throw new Error('Nie udało się pobrać pliku gry (' + res.status + ').');
        return res.arrayBuffer();
      })
      .then(function (buffer) {
        return player.loadProjectFromBuffer(buffer, 'sb3');
      })
      .catch(function (err) {
        fail('Nie udało się wczytać gry: ' + err.message);
      });
  }());
  </script>
</body>
</html>

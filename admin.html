<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel administratora - My Games</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function () {
  var mode = localStorage.getItem('themeMode') || 'auto';
  if (mode !== 'auto') document.documentElement.setAttribute('data-theme', mode);
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="5"/><line x1="7" y1="10" x2="7" y2="14"/><line x1="5" y1="12" x2="9" y2="12"/><circle cx="15" cy="10.5" r="1"/><circle cx="17.5" cy="13" r="1"/></svg> MY GAMES</a>
    <nav class="site-nav" id="site-nav">
      <span class="nav-indicator" id="nav-indicator"></span>
      <a href="index.html" data-nav="index">Główne</a>
      <a href="settings.html" data-nav="settings">Ustawienia</a>
      <a href="add-game.html" data-nav="add-game">+ Dodaj grę</a>
    </nav>
    <div class="account-widget" id="account-widget"></div>
  </header>

  <main class="settings-page">
    <h1>Panel administratora</h1>

    <p class="settings-hint" id="admin-denied" hidden>Nie masz dostępu do tej strony.</p>

    <section class="settings-section" id="accounts-section" hidden>
      <h2>Konta użytkowników</h2>
      <p class="settings-hint">Nadawaj i odbieraj status administratora.</p>
      <div id="accounts-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Zrobione z ❤️ i hostowane na GitHub Pages</p>
  </footer>

  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script type="module">
    import { isCurrentUserAdmin, getAllAccounts, setAccountAdmin, deleteAccount, getCurrentUser } from './auth.js';

    const deniedEl = document.getElementById('admin-denied');
    const sectionEl = document.getElementById('accounts-section');
    const listEl = document.getElementById('accounts-list');

    const HARDCODED_ADMIN = 'tpraglowski';
    const TRASH_ICON = '<svg class="icon" viewBox="0 0 20 20"><path d="M4 6h12"/><path d="M8 6V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"/><path d="M5.5 6l.7 9.5a1 1 0 0 0 1 .9h5.6a1 1 0 0 0 1-.9L15 6"/><line x1="8.5" y1="9" x2="8.5" y2="13.5"/><line x1="11.5" y1="9" x2="11.5" y2="13.5"/></svg>';

    function renderAccounts(accounts) {
      const myUsername = (getCurrentUser() || '').trim().toLowerCase();
      listEl.innerHTML = '';
      accounts
        .slice()
        .sort(function (a, b) { return a.username.localeCompare(b.username); })
        .forEach(function (acc) {
          const isHardcodedAdmin = acc.id === HARDCODED_ADMIN;
          const isAdminAcc = isHardcodedAdmin || acc.admin === true;
          const isSelf = acc.id === myUsername;

          const row = document.createElement('div');
          row.className = 'account-row';

          const name = document.createElement('span');
          name.className = 'account-row__name';
          name.textContent = acc.username;

          const badge = document.createElement('span');
          badge.className = 'account-row__badge' + (isAdminAcc ? ' account-row__badge--admin' : '');
          badge.textContent = isHardcodedAdmin ? 'Administrator (główny)' : (isAdminAcc ? 'Administrator' : 'Użytkownik');

          row.append(name, badge);

          if (!isHardcodedAdmin) {
            const toggleBtn = document.createElement('button');
            toggleBtn.type = 'button';
            toggleBtn.className = 'btn btn--ghost';
            toggleBtn.textContent = isAdminAcc ? 'Odbierz administratora' : 'Nadaj administratora';
            toggleBtn.addEventListener('click', async function () {
              toggleBtn.disabled = true;
              await setAccountAdmin(acc.id, !isAdminAcc);
              acc.admin = !isAdminAcc;
              renderAccounts(accounts);
            });
            row.append(toggleBtn);
          }

          if (!isHardcodedAdmin && !isSelf) {
            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'btn btn--danger';
            deleteBtn.innerHTML = TRASH_ICON + ' Usuń konto';
            deleteBtn.addEventListener('click', async function () {
              if (!confirm('Na pewno usunąć konto „' + acc.username + '”?')) return;
              deleteBtn.disabled = true;
              await deleteAccount(acc.id);
              const idx = accounts.indexOf(acc);
              if (idx !== -1) accounts.splice(idx, 1);
              renderAccounts(accounts);
            });
            row.append(deleteBtn);
          }

          listEl.appendChild(row);
        });
    }

    const admin = await isCurrentUserAdmin();
    if (!admin) {
      deniedEl.hidden = false;
    } else {
      sectionEl.hidden = false;
      const accounts = await getAllAccounts();
      renderAccounts(accounts);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graj - My Games</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function () {
  var mode = localStorage.getItem('themeMode') || 'auto';
  if (mode !== 'auto') document.documentElement.setAttribute('data-theme', mode);
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="5"/><line x1="7" y1="10" x2="7" y2="14"/><line x1="5" y1="12" x2="9" y2="12"/><circle cx="15" cy="10.5" r="1"/><circle cx="17.5" cy="13" r="1"/></svg> MY GAMES</a>
    <nav class="site-nav" id="site-nav">
      <span class="nav-indicator" id="nav-indicator"></span>
      <a href="index.html" data-nav="index">Główne</a>
      <a href="settings.html" data-nav="settings">Ustawienia</a>
      <a href="add-game.html" data-nav="add-game">+ Dodaj grę</a>
    </nav>
    <div class="account-widget" id="account-widget"></div>
  </header>

  <main class="play-page" id="play-page"></main>

  <footer class="site-footer">
    <p>Zrobione z ❤️ i hostowane na GitHub Pages</p>
  </footer>

  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script type="module">
    import { getGameById, deleteGame } from './games.js';
    import { getCurrentUser, isCurrentUserAdmin } from './auth.js';

    var page = document.getElementById('play-page');
    var params = new URLSearchParams(window.location.search);
    var gameId = params.get('id');
    var game = await getGameById(gameId);

    if (!game) {
      page.innerHTML =
        '<div class="form-card">' +
        '<h1>Nie znaleziono gry</h1>' +
        '<p class="settings-hint">Ta gra nie istnieje albo została usunięta.</p>' +
        '<a class="btn btn--accent" href="index.html">Wróć do listy gier</a>' +
        '</div>';
    } else {
      var isNative = game.type === 'native';

      var titleEl = document.createElement('h1');
      titleEl.textContent = game.title;

      var metaEl = document.createElement('p');
      metaEl.className = 'play-meta';
      metaEl.textContent = isNative
        ? ('Autor: ' + (game.author || game.addedBy) + ' · Dodał: @' + game.addedBy)
        : ('Autor na Scratchu: ' + game.scratchAuthor + ' · Dodał: @' + game.addedBy);

      var frameWrap = document.createElement('div');
      frameWrap.className = 'scratch-embed' + (isNative ? ' scratch-embed--native' : '');

      var iframe = document.createElement('iframe');
      iframe.src = isNative ? game.path : ('https://scratch.mit.edu/projects/' + encodeURIComponent(game.scratchProjectId) + '/embed');
      iframe.allowFullscreen = true;
      frameWrap.appendChild(iframe);

      var actions = document.createElement('div');
      actions.className = 'play-actions';

      var backLink = document.createElement('a');
      backLink.className = 'btn btn--ghost play-back';
      backLink.href = 'index.html';
      backLink.textContent = '← Wróć do listy gier';

      var fullscreenBtn = document.createElement('button');
      fullscreenBtn.type = 'button';
      fullscreenBtn.className = 'btn btn--accent';
      fullscreenBtn.innerHTML = '<svg class="icon" viewBox="0 0 20 20"><path d="M3 8V4a1 1 0 0 1 1-1h4"/><path d="M17 8V4a1 1 0 0 0-1-1h-4"/><path d="M3 12v4a1 1 0 0 0 1 1h4"/><path d="M17 12v4a1 1 0 0 1-1 1h-4"/></svg> Pełny ekran';
      fullscreenBtn.addEventListener('click', function () {
        if (frameWrap.requestFullscreen) {
          frameWrap.requestFullscreen();
        } else if (frameWrap.webkitRequestFullscreen) {
          frameWrap.webkitRequestFullscreen();
        }
      });

      actions.append(backLink, fullscreenBtn);

      var currentUser = getCurrentUser();
      var canDelete = currentUser === game.addedBy || await isCurrentUserAdmin();
      if (canDelete) {
        var deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'btn btn--danger';
        deleteBtn.innerHTML = '<svg class="icon" viewBox="0 0 20 20"><path d="M4 6h12"/><path d="M8 6V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"/><path d="M5.5 6l.7 9.5a1 1 0 0 0 1 .9h5.6a1 1 0 0 0 1-.9L15 6"/><line x1="8.5" y1="9" x2="8.5" y2="13.5"/><line x1="11.5" y1="9" x2="11.5" y2="13.5"/></svg> Usuń grę';
        deleteBtn.addEventListener('click', async function () {
          if (!confirm('Na pewno usunąć grę „' + game.title + '”?')) return;
          deleteBtn.disabled = true;
          await deleteGame(gameId);
          window.location.href = 'index.html';
        });
        actions.append(deleteBtn);
      }

      page.append(titleEl, metaEl, frameWrap, actions);
    }
  </script>
</body>
</html>

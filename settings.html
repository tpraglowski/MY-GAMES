<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ustawienia - My Games</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function () {
  var mode = localStorage.getItem('themeMode') || 'auto';
  if (mode !== 'auto') document.documentElement.setAttribute('data-theme', mode);
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">🎮 MY GAMES</a>
    <nav class="site-nav" id="site-nav">
      <span class="nav-indicator" id="nav-indicator"></span>
      <a href="index.html" data-nav="index">Główne</a>
      <a href="settings.html" data-nav="settings" class="is-active">Ustawienia</a>
      <a href="add-game.html" data-nav="add-game">+ Dodaj grę</a>
    </nav>
    <div class="account-widget" id="account-widget"></div>
  </header>

  <main class="settings-page">
    <h1>Ustawienia</h1>

    <section class="settings-section">
      <h2>Wygląd</h2>
      <p class="settings-hint">Wybierz tryb kolorystyczny strony. Tryb „Auto” dopasowuje się do ustawień systemu.</p>
      <div class="theme-options" id="theme-options">
        <button type="button" class="theme-option" data-theme-mode="light">☀️ Jasny</button>
        <button type="button" class="theme-option" data-theme-mode="dark">🌙 Ciemny</button>
        <button type="button" class="theme-option" data-theme-mode="auto">🖥️ Auto</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Zrobione z ❤️ i hostowane na GitHub Pages</p>
  </footer>

  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
</body>
</html>

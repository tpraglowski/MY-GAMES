<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ustawienia - My Games</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function () {
  var mode = localStorage.getItem('themeMode') || 'auto';
  if (mode !== 'auto') document.documentElement.setAttribute('data-theme', mode);
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="5"/><line x1="7" y1="10" x2="7" y2="14"/><line x1="5" y1="12" x2="9" y2="12"/><circle cx="15" cy="10.5" r="1"/><circle cx="17.5" cy="13" r="1"/></svg> MY GAMES</a>
    <nav class="site-nav" id="site-nav">
      <span class="nav-indicator" id="nav-indicator"></span>
      <a href="index.html" data-nav="index">Główne</a>
      <a href="settings.html" data-nav="settings" class="is-active">Ustawienia</a>
      <a href="add-game.html" data-nav="add-game">+ Dodaj grę</a>
    </nav>
    <div class="account-widget" id="account-widget"></div>
  </header>

  <main class="settings-page">
    <h1>Ustawienia</h1>

    <section class="settings-section">
      <h2>Wygląd</h2>
      <p class="settings-hint">Wybierz tryb kolorystyczny strony. Tryb „Auto” dopasowuje się do ustawień systemu.</p>
      <div class="theme-options" id="theme-options">
        <button type="button" class="theme-option" data-theme-mode="light"><svg class="icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.2"/><line x1="10" y1="2" x2="10" y2="4.2"/><line x1="10" y1="15.8" x2="10" y2="18"/><line x1="2" y1="10" x2="4.2" y2="10"/><line x1="15.8" y1="10" x2="18" y2="10"/><line x1="4.6" y1="4.6" x2="6.1" y2="6.1"/><line x1="13.9" y1="13.9" x2="15.4" y2="15.4"/><line x1="4.6" y1="15.4" x2="6.1" y2="13.9"/><line x1="13.9" y1="6.1" x2="15.4" y2="4.6"/></svg> Jasny</button>
        <button type="button" class="theme-option" data-theme-mode="dark"><svg class="icon" viewBox="0 0 20 20"><path d="M16 12.5A6.5 6.5 0 1 1 7.5 4a5.2 5.2 0 0 0 8.5 8.5z"/></svg> Ciemny</button>
        <button type="button" class="theme-option" data-theme-mode="auto"><svg class="icon" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="10" rx="1.2"/><line x1="7" y1="17" x2="13" y2="17"/><line x1="10" y1="13.5" x2="10" y2="17"/></svg> Auto</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Zrobione z ❤️ i hostowane na GitHub Pages</p>
  </footer>

  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>

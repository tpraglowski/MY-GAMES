<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Games</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function () {
  var mode = localStorage.getItem('themeMode') || 'auto';
  if (mode !== 'auto') document.documentElement.setAttribute('data-theme', mode);
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="5"/><line x1="7" y1="10" x2="7" y2="14"/><line x1="5" y1="12" x2="9" y2="12"/><circle cx="15" cy="10.5" r="1"/><circle cx="17.5" cy="13" r="1"/></svg> MY GAMES</a>
    <nav class="site-nav" id="site-nav">
      <span class="nav-indicator" id="nav-indicator"></span>
      <a href="index.html" data-nav="index" class="is-active">Główne</a>
      <a href="settings.html" data-nav="settings">Ustawienia</a>
      <a href="add-game.html" data-nav="add-game">+ Dodaj grę</a>
    </nav>
    <div class="account-widget" id="account-widget"></div>
  </header>

  <main>
    <section class="hero">
      <h1>Witaj na stronie z gierkami!</h1>
      <p>Wybierz grę z listy poniżej, żeby zacząć.</p>
    </section>

    <section class="search-bar">
      <div class="search-bar__wrap">
        <svg class="icon search-bar__icon" viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><line x1="13.5" y1="13.5" x2="18" y2="18"/></svg>
        <input type="search" id="game-search" placeholder="Szukaj gry po tytule, autorze lub użytkowniku...">
      </div>
    </section>

    <p class="settings-hint" id="no-results" hidden>Brak gier pasujących do wyszukiwania.</p>

    <section class="game-grid" id="game-grid"></section>
  </main>

  <footer class="site-footer">
    <p>Zrobione z ❤️ i hostowane na GitHub Pages</p>
  </footer>

  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>

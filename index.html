<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Games</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">🎮 MY GAMES</div>
  </header>

  <main>
    <section class="hero">
      <h1>Witaj na stronie z gierkami!</h1>
      <p>Wybierz grę z listy poniżej, żeby zacząć.</p>
    </section>

    <section class="game-grid" id="game-grid">
      <a class="game-card game-card--empty" href="#">
        <div class="game-card__icon">➕</div>
        <div class="game-card__title">Wkrótce nowa gra</div>
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <p>Zrobione z ❤️ i hostowane na GitHub Pages</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
